name: Deploy kompas

on:
  push:
    branches: [ main ]
    paths:
      - 'kompas/**'
      - '.github/workflows/deploy-kompas.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kompas
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./kompas
          file: ./kompas/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.KOMPAS_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.KOMPAS_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.KOMPAS_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ secrets.KOMPAS_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.KOMPAS_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
